<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Leaderboard Website</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f8fafc;
      background: radial-gradient(ellipse at top, #253b63 0%, #101827 58%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { max-width: 600px; }
    p { color: #a9bbd5; font-size: 1.1rem; }
    h1 { margin: 0; font-size: clamp(3rem, 10vw, 5rem); letter-spacing: -0.06em; }
  </style>
</head>
<body>
  <main>
    <h1>Hello World</h1>
    <p>Welcome to the Leaderboard Website.</p>
  </main>
</body>
</html>
